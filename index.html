<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 05 - ES6, Modules, Callbacks, Promises</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <!-- If you already have an index.html, copy only this <section> and the <script> tag below it -->
  <section id="lab05" class="container my-4">
    <h2 class="mb-4">Lab 05</h2>

    <h3>Task 1: Course Enrollment Manager</h3>
    <div id="task1-output" class="mb-4"></div>

    <h3>Task 2: Student Utility Module</h3>
    <p id="department-name" class="fw-bold"></p>
    <div id="task2-output" class="mb-4"></div>

    <h3>Task 3: Online Examination Workflow</h3>
    <button id="run-valid" class="btn btn-primary btn-sm">Run (valid roll number)</button>
    <button id="run-empty" class="btn btn-secondary btn-sm">Run (empty roll number)</button>
    <div id="task3-output" class="mt-3 mb-4"></div>

    <h3>Task 4: University Result Portal</h3>

    <h5 class="mt-3">Part A: Promise chain demo</h5>
    <button id="chain-btn" class="btn btn-outline-primary btn-sm">Search BSCS-001 (then/catch/finally)</button>
    <div id="task4-chain-output" class="mt-3 mb-4"></div>

    <h5>Parts B, C, D: Search and Load All</h5>
    <input id="roll-input" class="form-control w-auto d-inline-block"
           placeholder="e.g. BSCS-001">
    <button id="search-btn" class="btn btn-primary">Search</button>
    <button id="load-all-btn" class="btn btn-success">Load All Results</button>
    <div id="task4-output" class="mt-3"></div>
  </section>

  <script type="module" src="lab05.js"></script>
</body>
</html>
